task_id: "007"
repository: "payments-api"
description: >
  Support account currencies: a transfer between accounts with different
  currencies must be rejected with 400, while a same-currency transfer succeeds.
allowed_files:
  - models.py
  - api.py
requirements:
  - check_currency_match
  - check_currency_mismatch
test_command: "python -m pytest test_bank.py test_currency.py -q"
max_retries: 2
metadata:
  difficulty: "easy"
  failure_inducements:
    - "ignore currencies and allow the mismatch to transfer"
    - "default every new account to USD regardless of the request"
